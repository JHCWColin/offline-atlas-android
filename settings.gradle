pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Optional local mirror for large Mozilla downloads; ignored by Git.
        maven { url uri('tools/.cache/maven'); content { includeGroup 'org.mozilla.geckoview' } }
        google(); mavenCentral(); maven { url 'https://maven.mozilla.org/maven2/' }
    }
}
rootProject.name = 'OfflineAtlas'
include ':app'
