name: Android offline snapshot build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify snapshot bytes and references
        run: python3 tools/verify_offline.py --strict --output offline-verification.json
      - name: Build developer-signed APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: offline-atlas-development-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            offline-verification.json
